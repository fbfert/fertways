name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-sqlite:
    name: Backend / SQLite
    runs-on: ubuntu-latest
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, ctype, dom, fileinfo, filter, hash, iconv, json, libxml, openssl, pcre, phar, session, tokenizer, xml, xmlwriter, bcmath, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: composer validate --strict
        working-directory: backend
        run: composer validate --strict

      - name: composer install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Confirma que não há cache de config em disco
        working-directory: backend
        run: |
          if [ -f bootstrap/cache/config.php ]; then
            echo "ABORTADO: existe bootstrap/cache/config.php versionado ou gerado antes do teste. Ele pode apontar para outro banco." >&2
            exit 1
          fi

      - name: php artisan test (SQLite em memória, via phpunit.xml)
        working-directory: backend
        run: php artisan test

  backend-mariadb:
    name: Backend / MariaDB
    runs-on: ubuntu-latest
    # Produção roda MariaDB 10.5.29 (confirmado via `mysql --version` no VPS). Não existe tag
    # oficial "10.5.29" no Docker Hub, então fixamos a minor "10.5" — mesma família, mesmos
    # padrões de sql_mode/explicit_defaults_for_timestamp (nenhum override em /etc/my.cnf.d no
    # VPS: são os defaults de fábrica do 10.5). Ver docs/ci.md.
    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: fertways_ci
          MARIADB_USER: fertways_ci
          MARIADB_PASSWORD: fertways_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_CONFIG_CACHE: bootstrap/cache/nao-existe-config.php
      APP_ROUTES_CACHE: bootstrap/cache/nao-existe-routes.php
      APP_EVENTS_CACHE: bootstrap/cache/nao-existe-events.php
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      FERTWAYS_MEDIA_DIR: /tmp/fertways-ci-media
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: fertways_ci
      DB_USERNAME: fertways_ci
      DB_PASSWORD: fertways_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, ctype, dom, fileinfo, filter, hash, iconv, json, libxml, openssl, pcre, phar, session, tokenizer, xml, xmlwriter, bcmath, pdo, pdo_mysql, mysqli
          coverage: none
          tools: composer:v2

      - name: composer validate --strict
        working-directory: backend
        run: composer validate --strict

      - name: composer install
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Confirma que não há cache de config em disco
        working-directory: backend
        run: |
          if [ -f bootstrap/cache/config.php ]; then
            echo "ABORTADO: existe bootstrap/cache/config.php versionado ou gerado antes do teste. Ele pode apontar para outro banco." >&2
            exit 1
          fi

      - name: Aguarda o serviço MariaDB responder
        run: |
          for i in $(seq 1 30); do
            mariadb-admin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && break
            echo "aguardando o MariaDB subir... ($i/30)"
            sleep 2
          done

      - name: Verifica a conexão efetiva ANTES de qualquer comando destrutivo
        working-directory: backend
        run: |
          SAIDA=$(php artisan tinker --execute='
            echo "CI_CHECK|" . config("database.default") . "|" . config("database.connections.mysql.database") . "|" . config("database.connections.mysql.host");
          ')
          echo "$SAIDA"
          echo "$SAIDA" | grep -q "CI_CHECK|mysql|fertways_ci|127.0.0.1" || {
            echo "ABORTADO: a conexão efetiva do Laravel não é mysql/fertways_ci/127.0.0.1. Não vou rodar migrate:fresh." >&2
            exit 1
          }

      - name: Prova o round-trip das migrations (fresh / rollback / migrate)
        working-directory: backend
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --force
          php artisan migrate --force

      - name: php artisan test (MariaDB)
        working-directory: backend
        run: php artisan test

  frontend-lint-build:
    name: Frontend / Lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configura Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run lint
        working-directory: frontend
        run: npm run lint

      - name: npm run build
        working-directory: frontend
        run: npm run build
